<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تفقيط | حوّل المبلغ لكلمات عربي للشيكات والفواتير</title>
<meta name="description" content="Tafqit: convert any amount to Arabic words with correct grammar for cheques and invoices. EGP, USD, SAR, AED, KWD, EUR. Offline, no signup.">
<meta property="og:title" content="تفقيط | Tafqit">
<meta property="og:description" content="Arabic numbers to words with correct grammar, for cheques and invoices. Runs in your browser.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23173a2e'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23c9a24a'%3E٣%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#f4ecd8;--ink:#173a2e;--gold:#b8902f;--line:#d9ccaa;--red:#9b2d20}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",Georgia,serif;font-size:19px;
background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(23,58,46,.06) 31px 32px)}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:26px}
h1{margin:0;font-size:54px;letter-spacing:1px}
header p{margin:6px 0 0;color:#4a5d52;font-size:18px}
.card{background:#fffaf0;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:22px;margin-bottom:22px}
label{display:block;font-size:15px;color:#4a5d52;margin-bottom:6px;font-family:system-ui,sans-serif}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1 1 200px}
input,select{width:100%;font:inherit;font-size:26px;padding:10px 12px;border:2px solid var(--ink);background:#fff;color:var(--ink);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
select{direction:rtl;font-size:20px}
.cheque{position:relative;background:#fffdf4;border:2px solid var(--gold);padding:26px 22px 22px;min-height:150px}
.cheque .tag{position:absolute;top:-13px;right:16px;background:var(--gold);color:#fff;font:600 13px system-ui,sans-serif;padding:3px 12px;letter-spacing:.5px}
#out{font-size:30px;line-height:1.7;min-height:52px}
#out.err{color:var(--red);font-size:20px}
.amt{font:700 20px system-ui,sans-serif;direction:ltr;text-align:left;margin-top:14px;border-top:1px dashed var(--gold);padding-top:10px;color:var(--gold)}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{font:600 16px system-ui,sans-serif;background:var(--ink);color:var(--paper);border:0;padding:11px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
button:hover{opacity:.88}
.opt{display:flex;align-items:center;gap:8px;font:15px system-ui,sans-serif;margin-top:14px}
.opt input{width:auto;box-shadow:none}
.ex{font-size:16px;color:#4a5d52}
.ex a{color:var(--ink);cursor:pointer;border-bottom:1px dotted var(--ink);margin-inline-end:12px}
footer{text-align:center;font:14px system-ui,sans-serif;color:#4a5d52;margin-top:30px}
footer a{color:var(--ink)}
@media print{body{background:#fff}.card:first-of-type,.btns,footer,header p,.ex,.opt{display:none}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>تفقيط</h1><p>اكتب المبلغ بالأرقام، واطلع المبلغ بالحروف بقواعد صح، للشيكات والفواتير</p></header>
<div class="card">
<div class="row">
<div><label for="n">المبلغ / Amount</label><input id="n" inputmode="decimal" value="12345.75" autocomplete="off"></div>
<div><label for="c">العملة / Currency</label>
<select id="c"><option value="EGP">جنيه مصري EGP</option><option value="USD">دولار أمريكي USD</option><option value="SAR">ريال سعودي SAR</option><option value="AED">درهم إماراتي AED</option><option value="KWD">دينار كويتي KWD</option><option value="EUR">يورو EUR</option></select></div>
</div>
<label class="opt"><input type="checkbox" id="ch" checked> صيغة الشيك: "فقط ... لا غير"</label>
<p class="ex">أمثلة: <a data-n="1">1</a><a data-n="2">2</a><a data-n="11">11</a><a data-n="1002">1002</a><a data-n="200000">200000</a><a data-n="1250.5">1250.50</a><a data-n="3000000">3,000,000</a></p>
</div>
<div class="card cheque"><span class="tag">بالحروف</span>
<div id="out"></div>
<div class="amt" id="amt"></div>
<div class="btns"><button id="copy">نسخ النص</button><button class="alt" id="print">طباعة</button></div>
</div>
<footer>يشتغل بالكامل في المتصفح، مفيش حاجة بتتبعت لأي سيرفر. · Runs offline in your browser. · <a href="https://github.com/mostaaafaomran-ctrl/tafqit">GitHub</a></footer>
</div>
<script src="core.js"></script>
<script>
var n=document.getElementById('n'),c=document.getElementById('c'),ch=document.getElementById('ch'),out=document.getElementById('out'),amt=document.getElementById('amt');
function run(){
  try{
    var t=Tafqit.toArabicWords(n.value,c.value,{cheque:ch.checked});
    out.className='';out.textContent=t;
    var v=n.value.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[٬,\s]/g,'');
    var num=Number(v);
    amt.textContent=c.value+' '+(isFinite(num)?num.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:3}):v);
  }catch(e){out.className='err';out.textContent=n.value.trim()?'اكتب رقم صحيح، مثلا 1250.75':'';amt.textContent=''}
}
[n,c,ch].forEach(function(e){e.addEventListener('input',run);e.addEventListener('change',run)});
document.querySelectorAll('.ex a').forEach(function(a){a.onclick=function(){n.value=a.dataset.n;run()}});
document.getElementById('copy').onclick=function(){navigator.clipboard.writeText(out.textContent);this.textContent='تم النسخ ✓';var b=this;setTimeout(function(){b.textContent='نسخ النص'},1400)};
document.getElementById('print').onclick=function(){window.print()};
run();
</script>
</body>
</html>
